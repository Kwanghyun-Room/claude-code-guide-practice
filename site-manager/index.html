<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사이트 링크 관리</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2129; --muted: #6b7280;
    --line: #e3e5e9; --accent: #2563eb; --accent-soft: #e8efff; --danger: #dc2626;
    --hover: #f1f3f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b; --panel: #1d2026; --text: #e6e8eb; --muted: #9aa1ab;
      --line: #2e323a; --accent: #6b9bff; --accent-soft: #24304a; --danger: #f87171;
      --hover: #262a31;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; height: 100vh; overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button {
    border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
    padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  button.icon { padding: 2px 6px; border: none; background: transparent; color: var(--muted); }
  button.icon:hover { background: var(--hover); color: var(--text); }
  button.icon.del:hover { color: var(--danger); }
  button:disabled { opacity: .35; cursor: default; }
  input {
    width: 100%; border: 1px solid var(--line); background: var(--bg);
    border-radius: 6px; padding: 6px 8px; min-width: 0;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* ---------- 좌측 패널 ---------- */
  #side {
    width: 340px; min-width: 240px; max-width: 70vw; flex: none;
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #resizer { width: 5px; cursor: col-resize; flex: none; background: transparent; }
  #resizer:hover, #resizer.active { background: var(--accent-soft); }
  .section { padding: 14px; border-bottom: 1px solid var(--line); }
  .section h2 {
    margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em;
    display: flex; justify-content: space-between; align-items: center;
  }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > button { flex: none; white-space: nowrap; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 1em; }
  .hint.ok { color: #16a34a; }

  #listWrap { flex: 1; overflow-y: auto; padding: 6px 8px; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 6px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent;
  }
  #list li:hover { background: var(--hover); }
  #list li.active { background: var(--accent-soft); border-color: var(--accent); }
  #list li.dragging { opacity: .4; }
  #list li.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  #list li.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .handle { cursor: grab; color: var(--muted); padding: 0 4px; user-select: none; }
  .num { color: var(--muted); font-size: 12px; width: 20px; text-align: right; flex: none; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .path { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; flex: none; opacity: .55; }
  #list li:hover .actions, #list li.active .actions { opacity: 1; }
  .edit-box { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; }

  #addForm { display: flex; flex-direction: column; gap: 6px; }
  .footer { padding: 10px 14px; display: flex; gap: 6px; border-top: 1px solid var(--line); }
  .footer button { flex: 1; font-size: 12px; }

  /* ---------- 우측 뷰 ---------- */
  #view { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #viewBar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #viewTitle { font-weight: 600; white-space: nowrap; }
  #viewUrl {
    flex: 1; min-width: 0; color: var(--muted); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #frameWrap { flex: 1; position: relative; background: #fff; }
  #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); background: var(--bg); text-align: center; padding: 16px;
  }

  @media (max-width: 720px) {
    body { flex-direction: column; height: auto; min-height: 100vh; overflow: auto; }
    #side { width: 100% !important; max-width: none; border-right: 0; border-bottom: 1px solid var(--line); max-height: 55vh; }
    #resizer { display: none; }
    #view { height: 70vh; }
  }
</style>
</head>
<body>

<aside id="side">
  <!-- 1. 메인 URL 관리 영역 -->
  <div class="section">
    <h2>메인 URL</h2>
    <div class="row">
      <input id="baseInput" placeholder="https://example.com" spellcheck="false">
      <button id="baseSave" class="primary">저장</button>
    </div>
    <div id="baseHint" class="hint"></div>
  </div>

  <!-- 2. 사이트 목록 관리 영역 -->
  <div class="section">
    <h2>사이트 추가</h2>
    <form id="addForm" autocomplete="off">
      <input id="addName" placeholder="이름 (예: 공지사항)">
      <div class="row">
        <input id="addPath" placeholder="뒷경로 또는 전체 URL 붙여넣기" spellcheck="false">
        <button class="primary" type="submit">추가</button>
      </div>
      <div id="addHint" class="hint"></div>
    </form>
  </div>

  <div class="section" style="border-bottom:0;padding-bottom:4px">
    <h2>사이트 목록 <span id="count"></span></h2>
  </div>
  <div id="listWrap"><ul id="list"></ul></div>

  <div class="footer">
    <button id="exportBtn" title="목록과 메인 URL을 JSON 파일로 저장">백업 내보내기</button>
    <button id="importBtn" title="JSON 파일에서 불러오기">백업 가져오기</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>
</aside>
<div id="resizer" title="드래그해서 폭 조절"></div>

<!-- 3. 임베딩 뷰 영역 -->
<main id="view">
  <div id="viewBar">
    <span id="viewTitle">사이트 뷰</span>
    <span id="viewUrl"></span>
    <button id="reloadBtn" title="새로고침">⟳ 새로고침</button>
  </div>
  <div id="frameWrap">
    <iframe id="frame" title="사이트 뷰" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div id="placeholder">왼쪽 목록에서 사이트를 클릭하면 여기에 열립니다.</div>
  </div>
</main>

<script>
(() => {
  const STORE_KEY = 'siteManager.v1';
  const $ = (id) => document.getElementById(id);

  // ---------- 상태 ----------
  let state = { baseUrl: '', sites: [], activeId: null, sideWidth: 340 };

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) state = Object.assign(state, JSON.parse(raw));
    } catch (e) { /* 저장소 사용 불가 시 빈 상태로 시작 */ }
    if (!Array.isArray(state.sites)) state.sites = [];
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---------- URL 처리 ----------
  function normalizeBase(v) {
    v = v.trim();
    if (!v) return '';
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    return v.replace(/\/+$/, '');
  }
  // 전체 URL이 들어오면 메인 URL(또는 도메인) 부분을 떼고 뒷경로만 남긴다
  function toPath(v) {
    v = v.trim();
    if (!v) return '';
    const base = state.baseUrl;
    if (base && v.toLowerCase().startsWith(base.toLowerCase())) {
      v = v.slice(base.length);
    } else if (/^https?:\/\//i.test(v)) {
      try { const u = new URL(v); v = u.pathname + u.search + u.hash; } catch (e) {}
    }
    if (v && !/^[\/?#]/.test(v)) v = '/' + v;
    return v === '/' ? '' : v;
  }
  function fullUrl(path) {
    return state.baseUrl ? state.baseUrl + (path || '') : '';
  }

  // ---------- 메인 URL 영역 ----------
  function renderBase() {
    $('baseInput').value = state.baseUrl;
    $('baseHint').className = 'hint';
    $('baseHint').textContent = state.baseUrl
      ? `사이트 ${state.sites.length}개가 이 주소를 사용합니다.`
      : '메인 URL을 먼저 입력하세요.';
  }
  function saveBase() {
    const v = normalizeBase($('baseInput').value);
    if (v && !/^https?:\/\/[^\/\s]+/i.test(v)) { alert('올바른 URL이 아닙니다.'); return; }
    const changed = v !== state.baseUrl;
    state.baseUrl = v;
    save();
    renderBase();
    renderList();
    if (changed) {
      $('baseHint').className = 'hint ok';
      $('baseHint').textContent = `변경 완료: 사이트 ${state.sites.length}개의 주소가 일괄 변경되었습니다.`;
      if (state.activeId) openSite(state.activeId);
    }
  }
  $('baseSave').onclick = saveBase;
  $('baseInput').onkeydown = (e) => { if (e.key === 'Enter') saveBase(); };

  // ---------- 사이트 추가 ----------
  $('addPath').addEventListener('input', () => {
    const p = toPath($('addPath').value);
    $('addHint').textContent = $('addPath').value.trim()
      ? `저장될 경로: ${p || '(메인 URL 그대로)'}` : '';
  });
  $('addForm').onsubmit = (e) => {
    e.preventDefault();
    const name = $('addName').value.trim();
    const rawPath = $('addPath').value;
    const path = toPath(rawPath);
    if (!name && !rawPath.trim()) { $('addName').focus(); return; }
    state.sites.push({ id: uid(), name: name || path || '(이름 없음)', path });
    save();
    $('addName').value = ''; $('addPath').value = ''; $('addHint').textContent = '';
    renderList(); renderBase();
    $('listWrap').scrollTop = $('listWrap').scrollHeight;
    $('addName').focus();
  };

  // ---------- 목록 ----------
  let editingId = null;

  function renderList() {
    const ul = $('list');
    ul.innerHTML = '';
    $('count').textContent = state.sites.length ? `${state.sites.length}개` : '';
    if (!state.sites.length) {
      ul.innerHTML = '<li class="empty" style="cursor:default">등록된 사이트가 없습니다.</li>';
      return;
    }
    state.sites.forEach((s, i) => {
      const li = document.createElement('li');
      li.dataset.id = s.id;
      if (s.id === state.activeId) li.classList.add('active');

      if (s.id === editingId) {
        li.style.cursor = 'default';
        li.innerHTML = `
          <div class="edit-box">
            <input class="e-name" placeholder="이름">
            <input class="e-path" placeholder="뒷경로" spellcheck="false">
            <div class="row" style="justify-content:flex-end">
              <button class="e-cancel" type="button">취소</button>
              <button class="e-save primary" type="button">저장</button>
            </div>
          </div>`;
        const n = li.querySelector('.e-name'), p = li.querySelector('.e-path');
        n.value = s.name; p.value = s.path;
        const commit = () => {
          s.name = n.value.trim() || s.name;
          s.path = toPath(p.value);
          editingId = null; save(); renderList();
          if (s.id === state.activeId) openSite(s.id);
        };
        li.querySelector('.e-save').onclick = commit;
        li.querySelector('.e-cancel').onclick = () => { editingId = null; renderList(); };
        [n, p].forEach(el => el.onkeydown = (e) => {
          if (e.key === 'Enter') commit();
          if (e.key === 'Escape') { editingId = null; renderList(); }
        });
        ul.appendChild(li);
        setTimeout(() => n.focus(), 0);
        return;
      }

      li.draggable = true;
      li.title = fullUrl(s.path) || '메인 URL이 설정되지 않았습니다';
      li.innerHTML = `
        <span class="handle" title="끌어서 순서 변경">⋮⋮</span>
        <span class="num">${i + 1}</span>
        <div class="info">
          <div class="name"></div>
          <div class="path"></div>
        </div>
        <div class="actions">
          <button class="icon up" title="위로" ${i === 0 ? 'disabled' : ''}>▲</button>
          <button class="icon down" title="아래로" ${i === state.sites.length - 1 ? 'disabled' : ''}>▼</button>
          <button class="icon edit" title="수정">✎</button>
          <button class="icon del" title="삭제">✕</button>
        </div>`;
      li.querySelector('.name').textContent = s.name;
      li.querySelector('.path').textContent = s.path || '/';

      li.onclick = (e) => {
        if (e.target.closest('button')) return;
        openSite(s.id);
      };
      li.querySelector('.up').onclick = () => move(i, i - 1);
      li.querySelector('.down').onclick = () => move(i, i + 1);
      li.querySelector('.edit').onclick = () => { editingId = s.id; renderList(); };
      li.querySelector('.del').onclick = () => {
        if (!confirm(`'${s.name}' 사이트를 목록에서 삭제할까요?`)) return;
        state.sites.splice(i, 1);
        if (state.activeId === s.id) { state.activeId = null; showPlaceholder(); }
        save(); renderList(); renderBase();
      };
      bindDrag(li);
      ul.appendChild(li);
    });
  }

  function move(from, to) {
    if (to < 0 || to >= state.sites.length || from === to) return;
    const [item] = state.sites.splice(from, 1);
    state.sites.splice(to, 0, item);
    save(); renderList();
  }

  // ---------- 드래그 앤 드롭 ----------
  let dragId = null;
  function clearDropMarks() {
    document.querySelectorAll('#list li').forEach(el => el.classList.remove('drop-before', 'drop-after'));
  }
  function bindDrag(li) {
    li.addEventListener('dragstart', (e) => {
      dragId = li.dataset.id;
      li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
    });
    li.addEventListener('dragend', () => {
      dragId = null; li.classList.remove('dragging'); clearDropMarks();
    });
    li.addEventListener('dragover', (e) => {
      if (!dragId || dragId === li.dataset.id) return;
      e.preventDefault();
      const r = li.getBoundingClientRect();
      const before = e.clientY < r.top + r.height / 2;
      clearDropMarks();
      li.classList.add(before ? 'drop-before' : 'drop-after');
    });
    li.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!dragId || dragId === li.dataset.id) return;
      const before = li.classList.contains('drop-before');
      const from = state.sites.findIndex(s => s.id === dragId);
      const [item] = state.sites.splice(from, 1);
      let to = state.sites.findIndex(s => s.id === li.dataset.id);
      if (!before) to += 1;
      state.sites.splice(to, 0, item);
      dragId = null; save(); renderList();
    });
  }

  // ---------- 뷰 영역 ----------
  function showPlaceholder(msg) {
    $('frame').removeAttribute('src');
    $('placeholder').style.display = 'flex';
    $('placeholder').textContent = msg || '왼쪽 목록에서 사이트를 클릭하면 여기에 열립니다.';
    $('viewTitle').textContent = '사이트 뷰';
    $('viewUrl').textContent = '';
  }
  function openSite(id) {
    const s = state.sites.find(x => x.id === id);
    if (!s) return;
    state.activeId = id; save();
    document.querySelectorAll('#list li').forEach(el => el.classList.toggle('active', el.dataset.id === id));
    $('viewTitle').textContent = s.name;
    if (!state.baseUrl) {
      showPlaceholder('메인 URL이 설정되지 않았습니다. 왼쪽 위에서 먼저 입력하세요.');
      $('viewTitle').textContent = s.name;
      return;
    }
    const url = fullUrl(s.path);
    $('viewUrl').textContent = url;
    $('placeholder').style.display = 'none';
    $('frame').src = url;
  }
  $('reloadBtn').onclick = () => { if (state.activeId) openSite(state.activeId); };

  // ---------- 백업 ----------
  $('exportBtn').onclick = () => {
    const data = JSON.stringify({ baseUrl: state.baseUrl, sites: state.sites }, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = `site-list-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!Array.isArray(d.sites)) throw new Error('sites 항목이 없습니다');
      if (!confirm(`사이트 ${d.sites.length}개를 불러옵니다. 현재 목록(${state.sites.length}개)은 교체됩니다. 계속할까요?`)) return;
      state.baseUrl = typeof d.baseUrl === 'string' ? d.baseUrl : state.baseUrl;
      state.sites = d.sites.map(s => ({ id: s.id || uid(), name: String(s.name || ''), path: String(s.path || '') }));
      state.activeId = null;
      save(); renderBase(); renderList(); showPlaceholder();
    } catch (err) {
      alert('불러오기 실패: ' + err.message);
    }
  };

  // ---------- 패널 폭 조절 ----------
  (() => {
    const side = $('side'), rz = $('resizer');
    side.style.width = state.sideWidth + 'px';
    rz.addEventListener('mousedown', (e) => {
      e.preventDefault();
      rz.classList.add('active');
      $('frame').style.pointerEvents = 'none';
      const onMove = (ev) => { side.style.width = Math.max(240, ev.clientX) + 'px'; };
      const onUp = () => {
        rz.classList.remove('active');
        $('frame').style.pointerEvents = '';
        state.sideWidth = side.getBoundingClientRect().width; save();
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  })();

  // ---------- 시작 ----------
  load();
  renderBase();
  renderList();
  if (state.activeId) openSite(state.activeId);
})();
</script>
</body>
</html>
